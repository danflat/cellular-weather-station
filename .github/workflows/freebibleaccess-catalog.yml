name: FreeBibleAccess verified ingest

on:
  push:
    branches:
      - scratch/freebibleaccess-ingest
    paths:
      - '.freebibleaccess/**'
      - '.github/workflows/freebibleaccess-catalog.yml'

permissions:
  contents: read

jobs:
  fetch-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live public catalog
        run: python .freebibleaccess/fetch_catalog.py
      - name: Upload catalog snapshot
        uses: actions/upload-artifact@v4
        with:
          name: freebibleaccess-live-catalog
          path: freebibleaccess-output/
          if-no-files-found: error
          retention-days: 1

  download-files:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify archive chunk
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_COUNT: 4
        run: python .freebibleaccess/download_chunk.py
      - name: Upload verified chunk
        uses: actions/upload-artifact@v4
        with:
          name: freebibleaccess-files-${{ matrix.chunk }}
          path: freebibleaccess-download/chunk-${{ matrix.chunk }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
